server:
  extraArgs: "-log-level=trace"
  affinity: ""
  ha:
    enabled: true
    raft:
      enabled: true
      replicas: 2
      setNodeId: true
      config: |
        cluster_name = "vault-integrated-storage"
        storage "raft" {
          path = "/vault/data/"
        }
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = "true"
        }
        service_registration "kubernetes" {}
        disable_mlock = true
        ui = true
