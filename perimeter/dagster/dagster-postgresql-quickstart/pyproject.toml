[project]
name = "dagster_postgresql_quickstart"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.27",
    "dagster-k8s>=0.29.27",
    "dagster-postgres>=0.29.27",
    "grpcio>=1.85.0",
    "grpcio-tools>=1.81.1",
    "pandas>=2.3.3",
    "sqlalchemy<2.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_postgresql_quickstart"
registry_modules = [
    "dagster_postgresql_quickstart.components.*",
]


