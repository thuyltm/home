[project]
name = "dagster_dbt_quickstart"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-cloud>=1.13.24",
    "dagster-dbt>=0.29.24",
    "dagster-duckdb>=0.29.24",
    "dbt-duckdb>=1.11.0",
    "fastparquet>=2026.9.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.10.9",
    "pyarrow>=25.0.1",
    "dbt-core>=1.12.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_dbt_quickstart"
registry_modules = [
    "dagster_dbt_quickstart.components.*",
]


